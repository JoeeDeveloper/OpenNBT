name: Bug report
description: Something in the tools misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: "OS and Python version"}
  - type: textarea
    id: log
    attributes: {label: "Traceback / output (remove VIN and MAC)", render: text}
